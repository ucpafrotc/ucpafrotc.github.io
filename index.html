<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a35">

<title>UC PAF ROTC</title>

<style>
:root {
  --navy: #071a35;
  --deep: #0c2d55;
  --blue: #205b91;
  --sky: #79b6e7;
  --ice: #d8ebfa;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--white);
  background:
    radial-gradient(
      ellipse at 50% 20%,
      #265c91 0%,
      #103961 40%,
      #071a35 100%
    );
}

/* Radar grid background */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(
      rgba(170,220,255,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(170,220,255,.045) 1px,
      transparent 1px
    );
  background-size: 38px 38px;
}

/* Main container */

.container {
  position: relative;
  width: min(1050px, calc(100% - 20px));
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px 0;
}

/* Header */

header {
  text-align: center;
  margin-bottom: 30px;
}

.insignia {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin: 0 auto 15px;
  border: 1px solid rgba(200,230,255,.4);
  border-radius: 50%;
  background: rgba(216,235,250,.07);
}

.insignia svg {
  width: 32px;
  height: 32px;
  fill: var(--ice);
}

.eyebrow {
  color: var(--sky);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}

h1 {
  margin: 10px 0;
  font-size: clamp(23px, 4vw, 42px);
  font-weight: 800;
  letter-spacing: 3px;
}

.intro {
  margin: 0;
  color: #bdd9ef;
  font-size: 12px;
  letter-spacing: 1px;
}

/* Always four columns */

.flight-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(5px, 1.5vw, 15px);
}

/* Flight cards */

.flight-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  text-decoration: none;
  color: var(--white);
  border: 1px solid rgba(175,220,255,.3);
  border-radius: 12px;
  background: linear-gradient(
    145deg,
    var(--card-light),
    var(--card-dark)
  );
  box-shadow: 0 8px 25px rgba(0,0,0,.22);
  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.flight-card:hover {
  transform: translateY(-6px);
  border-color: #c3e5ff;
  box-shadow: 0 14px 30px rgba(57,148,230,.3);
}

.flight-card:focus-visible {
  outline: 3px solid var(--ice);
  outline-offset: 3px;
}

/* Different blue tones */

.quebec {
  --card-light: #194875;
  --card-dark: #071b37;
}

.romeo {
  --card-light: #306d9f;
  --card-dark: #123452;
}

.sierra {
  --card-light: #205687;
  --card-dark: #092746;
}

.tango {
  --card-light: #3979aa;
  --card-dark: #103b68;
}

/* Card identifier */

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 3px;
  padding: 11px 12px 0;
  font-family: Consolas, monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: #c3e2f9;
}

.status-dot {
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9be4cc;
  box-shadow: 0 0 8px #9be4cc;
}

/* Aircraft area */

.aircraft-stage {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  aspect-ratio: 1.35;
  overflow: hidden;
}

.aircraft-stage::before {
  content: "";
  position: absolute;
  width: 55%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid rgba(200,230,255,.2);
  box-shadow:
    0 0 0 25px rgba(200,230,255,.035),
    0 0 0 26px rgba(200,230,255,.1),
    0 0 0 50px rgba(200,230,255,.02),
    0 0 0 51px rgba(200,230,255,.08);
}

.aircraft-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      90deg,
      transparent calc(50% - .5px),
      rgba(200,230,255,.12) 50%,
      transparent calc(50% + .5px)
    ),
    linear-gradient(
      transparent calc(50% - .5px),
      rgba(200,230,255,.12) 50%,
      transparent calc(50% + .5px)
    );
}

/* Aircraft SVG */

.aircraft-svg {
  position: relative;
  z-index: 1;
  display: block;
  width: 94%;
  height: auto;
  overflow: visible;
}

.aircraft {
  fill: #b8d8ef;
  stroke: #ecf7ff;
  stroke-width: 2;
  stroke-linejoin: round;
  transform-origin: 100px 65px;
  filter: drop-shadow(0 8px 6px rgba(0,12,35,.6));
  transition: transform .35s ease;
}

.flight-card:hover .aircraft {
  transform: translateY(-5px) scale(1.07);
}

.panel {
  fill: #6999c0;
  stroke: #d2ecff;
  stroke-width: 1.2;
}

.dark-panel {
  fill: #285479;
  stroke: #a6d3f2;
  stroke-width: 1.2;
}

.canopy {
  fill: #0a2c4d;
  stroke: #a8e0ff;
  stroke-width: 2;
}

.detail {
  fill: none;
  stroke: #46769c;
  stroke-width: 1.5;
}

/* Card labels */

.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  min-width: 0;
  margin-top: auto;
  padding: 13px 12px;
  border-top: 1px solid rgba(200,230,255,.18);
  background: rgba(3,17,35,.3);
}

.card-info {
  min-width: 0;
}

.card-title {
  margin: 0 0 5px;
  font-size: clamp(10px, 1.8vw, 19px);
  font-weight: 800;
  letter-spacing: clamp(0px, .25vw, 2px);
  white-space: nowrap;
}

.card-subtitle {
  color: #b5d7ef;
  font-size: clamp(7px, .95vw, 11px);
  line-height: 1.35;
}

.arrow {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(210,237,255,.4);
  background: rgba(210,237,255,.1);
  font-size: 17px;
  transition: background .3s ease;
}

.flight-card:hover .arrow {
  background: #2563a6;
}

/* Footer */

footer {
  margin-top: 28px;
  padding-top: 14px;
  border-top: 1px solid rgba(200,230,255,.13);
  color: #8cb8dc;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
}

/* Compact phones: retain 4 columns */

@media (max-width: 600px) {
  .container {
    width: calc(100% - 12px);
    padding: 22px 0;
  }

  header {
    margin-bottom: 20px;
  }

  .insignia {
    width: 43px;
    height: 43px;
  }

  h1 {
    font-size: 25px;
  }

  .intro {
    font-size: 10px;
  }

  .flight-grid {
    gap: 5px;
  }

  .flight-card {
    border-radius: 6px;
  }

  .card-top {
    padding: 7px 5px 0;
    font-size: 7px;
    letter-spacing: 0;
  }

  .status-dot {
    width: 4px;
    height: 4px;
  }

  .aircraft-stage {
    aspect-ratio: 1;
  }

  .aircraft-svg {
    width: 100%;
  }

  .card-bottom {
    padding: 8px 4px;
  }

  .card-title {
    font-size: clamp(9px, 2.4vw, 13px);
    letter-spacing: 0;
    margin-bottom: 3px;
  }

  .card-subtitle {
    font-size: 7px;
  }

  .arrow {
    display: none;
  }

  footer {
    font-size: 8px;
    letter-spacing: 1px;
  }
}

@media (max-width: 360px) {
  .card-top {
    font-size: 6px;
  }

  .card-title {
    font-size: 9px;
  }

  .card-subtitle {
    font-size: 6px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
