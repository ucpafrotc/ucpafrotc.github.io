<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060b">

<title>UC PAF ROTC</title>

<style>
:root {
  --background: #05060b;
  --text: #d7dce7;
  --crimson: #ff245a;
  --magenta: #ff4188;
  --violet: #a92dff;
  --electric-blue: #55c7ff;
  --ice-blue: #c5efff;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow-x: hidden;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      #191020 0%,
      #0a0912 40%,
      #05060b 78%
    );

  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
}

/* Atmospheric background */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(255,255,255,.015) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.015) 1px,
      transparent 1px
    );

  background-size: 55px 55px;

  mask-image:
    radial-gradient(
      ellipse at center,
      black 5%,
      transparent 75%
    );
}

/* Main layout */

.portal {
  position: relative;
  width: 100%;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 50px 16px;
  isolation: isolate;
}

/* C.Ops title */

.page-title {
  position: relative;
  margin: 0 0 65px;

  font-size: clamp(44px, 8vw, 88px);
  font-weight: 800;
  letter-spacing: clamp(4px, 1.2vw, 12px);
  line-height: 1.15;
  text-align: center;

  color: var(--ice-blue);

  text-shadow:
    0 0 5px rgba(210,245,255,.9),
    0 0 13px rgba(85,199,255,.85),
    0 0 30px rgba(35,150,255,.55),
    0 0 65px rgba(0,105,255,.25);

  animation: titleGlow 5s ease-in-out infinite;
}

.page-title::after {
  content: "";
  position: absolute;

  left: 15%;
  right: 15%;
  bottom: -19px;
  height: 2px;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #55c7ff,
      #c5efff,
      #55c7ff,
      transparent
    );

  box-shadow:
    0 0 9px rgba(85,199,255,.8),
    0 0 22px rgba(45,155,255,.35);
}

/* Visor assembly */

.visor-container {
  position: relative;

  width: min(88vw, 880px);
  height: clamp(90px, 14vw, 145px);

  display: flex;
  align-items: center;
  justify-content: center;
}

/* Wide atmospheric light bloom */

.visor-container::before {
  content: "";
  position: absolute;

  width: 88%;
  height: 105%;

  border-radius: 50%;

  background:
    linear-gradient(
      90deg,
      rgba(155,18,73,.12),
      rgba(255,32,89,.38),
      rgba(255,58,126,.40),
      rgba(135,35,220,.15)
    );

  filter: blur(48px);
  opacity: .75;

  animation: atmosphericPulse 6s ease-in-out infinite;
}

/* Metallic outer housing */

.visor {
  position: relative;
  width: 100%;
  height: 74%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: clamp(12px, 2vw, 19px);

  border-radius: clamp(18px, 3vw, 29px);

  background:
    linear-gradient(
      180deg,
      #454856 0%,
      #222531 9%,
      #11131d 23%,
      #080b13 48%,
      #151722 76%,
      #353948 94%,
      #11131b 100%
    );

  border: 1px solid #555767;

  box-shadow:
    0 25px 35px rgba(0,0,0,.65),
    0 4px 8px rgba(0,0,0,.9),
    inset 0 2px 2px rgba(255,255,255,.16),
    inset 0 -3px 5px rgba(0,0,0,.9);
}

/* Upper housing reflection */

.visor::before {
  content: "";
  position: absolute;

  top: 5px;
  left: 5%;
  right: 5%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,235,255,.5),
      rgba(255,255,255,.15),
      transparent
    );

  pointer-events: none;
}

/* Internal housing seam */

.visor::after {
  content: "";
  position: absolute;
  inset: 5px;

  border: 1px solid rgba(0,0,0,.65);
  border-radius: inherit;

  pointer-events: none;
}

/* Recessed lens housing */

.visor-recess {
  position: relative;
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 5px;

  border-radius: clamp(12px, 2vw, 20px);

  background:
    linear-gradient(
      180deg,
      #020308 0%,
      #070710 45%,
      #140712 100%
    );

  border: 1px solid rgba(0,0,0,.9);

  box-shadow:
    inset 0 5px 8px rgba(0,0,0,.95),
    inset 0 -2px 4px rgba(255,255,255,.06);
}

/* Illuminated visor lens */

.visor-light {
  position: relative;

  width: 100%;
  height: 82%;

  overflow: hidden;

  border-radius: clamp(9px, 1.5vw, 15px);

  background:
    linear-gradient(
      180deg,
      #370b20 0%,
      #ad1246 14%,
      #ff2867 29%,
      #ff79a3 43%,
      #fff1f4 50%,
      #ff8bb5 57%,
      #ff326c 74%,
      #a51044 90%,
      #3d0b20 100%
    );

  box-shadow:
    0 0 6px #ff9cbe,
    0 0 16px rgba(255,56,119,.95),
    0 0 32px rgba(255,33,102,.75),
    0 0 65px rgba(255,29,95,.42),
    0 0 110px rgba(195,28,138,.22),
    inset 0 0 10px rgba(255,230,240,.35);

  animation: lightBreathe 5.5s ease-in-out infinite;
}

/* Bright horizontal core */

.visor-light::before {
  content: "";
  position: absolute;

  left: 3%;
  right: 3%;
  top: 47%;

  height: 4px;
  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,215,233,.7) 16%,
      #ffffff 49%,
      rgba(255,215,233,.7) 84%,
      transparent
    );

  filter: blur(2px);
  opacity: .8;
}

/* Moving reflection */

.visor-light::after {
  content: "";
  position: absolute;

  top: -50%;
  bottom: -50%;
  width: 18%;
  left: -30%;

  transform: skewX(-22deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.04),
      rgba(255,255,255,.22),
      rgba(255,255,255,.04),
      transparent
    );

  animation: scanReflection 8s ease-in-out infinite;
}

/* Side hardware */

.visor-cap {
  position: absolute;
  z-index: -1;

  top: 28%;
  width: 4%;
  height: 44%;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      #424653,
      #0c0e17 30%,
      #151823 75%,
      #343845
    );

  border: 1px solid #353948;

  box-shadow:
    0 5px 15px rgba(0,0,0,.7);
}

.visor-cap.left {
  left: -2%;
}

.visor-cap.right {
  right: -2%;
}

/* Reflected red light */

.visor-reflection {
  position: absolute;

  top: 90%;
  left: 12%;
  width: 76%;
  height: 20px;

  border-radius: 50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,42,100,.22),
      rgba(255,80,145,.35),
      rgba(255,42,100,.22),
      transparent
    );

  filter: blur(17px);
}

/* Rules navigation */

.action {
  margin-top: 65px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.action-line {
  width: 62px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,85,142,.75),
      transparent
    );
}

.rules-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  padding: 14px 28px;

  border: 1px solid rgba(255,100,153,.25);
  border-radius: 8px;

  background: rgba(255,255,255,.025);

  color: #f0e6ee;

  font-size: 12px;
  font-weight: 700;
  letter-spacing: 4px;
  text-decoration: none;

  transition:
    color .3s ease,
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    transform .3s ease;
}

.rules-link:hover {
  color: #ffffff;

  background: rgba(255,35,95,.09);
  border-color: rgba(255,105,161,.7);

  box-shadow:
    0 0 18px rgba(255,36,103,.15),
    inset 0 0 15px rgba(255,36,103,.04);

  transform: translateY(-3px);
}

.rules-link:focus-visible {
  outline: 2px solid #ff84b6;
  outline-offset: 5px;
}

.rules-link svg {
  width: 15px;
  height: 15px;
  stroke: #ff8db7;

  transition: transform .3s ease;
}

.rules-link:hover svg {
  transform: translateX(4px);
}

/* Animations */

@keyframes titleGlow {
  0%, 100% {
    opacity: 1;
    filter: brightness(1);
  }

  50% {
    opacity: .94;
    filter: brightness(1.18);
  }
}

@keyframes lightBreathe {
  0%, 100% {
    opacity: .88;
    filter: brightness(.94);
  }

  50% {
    opacity: 1;
    filter: brightness(1.15);
  }
}

@keyframes atmosphericPulse {
  0%, 100% {
    opacity: .55;
    transform: scale(.98);
  }

  50% {
    opacity: .85;
    transform: scale(1.03);
  }
}

@keyframes scanReflection {
  0%, 14% {
    left: -30%;
  }

  48%, 100% {
    left: 115%;
  }
}

/* Mobile */

@media (max-width: 600px) {
  .page-title {
    font-size: clamp(42px, 12vw, 62px);
    letter-spacing: 5px;
    margin-bottom: 55px;
  }

  .visor-container {
    width: 92vw;
    height: 95px;
  }

  .visor {
    height: 68%;
    padding: 10px;
    border-radius: 17px;
  }

  .visor-recess {
    border-radius: 12px;
    padding: 4px;
  }

  .visor-light {
    border-radius: 8px;
  }

  .action {
    margin-top: 50px;
  }

  .rules-link {
    padding: 13px 22px;
    font-size: 11px;
    letter-spacing: 3px;
  }
}

/* Reduced motion */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="portal">

  <!-- Glowing blue title -->

  <h1 class="page-title">
    C.Ops
  </h1>

  <!-- Futuristic visor -->

  <div
    class="visor-container"
    role="img"
    aria-label="Futuristic metallic visor with a glowing crimson and magenta lens"
  >

    <div class="visor-cap left"></div>
    <div class="visor-cap right"></div>

    <div class="visor">

      <div class="visor-recess">

        <div class="visor-light"></div>

      </div>

    </div>

    <div class="visor-reflection"></div>

  </div>

  <!-- Rules link -->

  <nav class="action" aria-label="Rules navigation">

    <div
      class="action-line"
      aria-hidden="true"
    ></div>

    <a
      class="rules-link"
      href="sierrados/rules.html"
    >

      VIEW RULES

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12 H19"/>
        <path d="M13 6 L19 12 L13 18"/>
      </svg>

    </a>

  </nav>

</main>

</body>
</html>
