<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05050b">
<meta name="description" content="UC PAF ROTC Access Portal">

<title>UC PAF ROTC</title>

<style>
:root {
  --background: #05050b;
  --text: #e3ddec;
  --violet: #a855f7;
  --purple: #8b5cf6;
  --lavender: #d8b4fe;
  --electric: #b75cff;
  --ice: #f3e8ff;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      #1c112b 0%,
      #0c0915 42%,
      #05050b 80%
    );

  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
}

/* Subtle background grid */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(180,145,255,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(180,145,255,.018) 1px,
      transparent 1px
    );

  background-size: 55px 55px;

  mask-image:
    radial-gradient(
      ellipse at center,
      black 5%,
      transparent 75%
    );
}

/* Main portal */

.portal {
  position: relative;
  width: 100%;
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 50px 16px;
  isolation: isolate;
}

/* Visor assembly */

.visor-container {
  position: relative;

  width: min(88vw, 880px);
  height: clamp(90px, 14vw, 145px);

  display: flex;
  align-items: center;
  justify-content: center;
}

/* Violet atmospheric bloom */

.visor-container::before {
  content: "";
  position: absolute;

  width: 90%;
  height: 115%;
  border-radius: 50%;

  background:
    linear-gradient(
      90deg,
      rgba(100,30,185,.15),
      rgba(147,51,234,.4),
      rgba(192,92,255,.45),
      rgba(99,40,210,.18)
    );

  filter: blur(50px);
  opacity: .75;

  animation: atmosphericPulse 6s ease-in-out infinite;
}

/* Metallic exterior */

.visor {
  position: relative;

  width: 100%;
  height: 74%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: clamp(12px, 2vw, 19px);

  border-radius: clamp(18px, 3vw, 29px);

  background:
    linear-gradient(
      180deg,
      #4a4658 0%,
      #272331 9%,
      #15121e 23%,
      #090811 48%,
      #191521 76%,
      #3b354a 94%,
      #13101c 100%
    );

  border: 1px solid #5a526b;

  box-shadow:
    0 25px 35px rgba(0,0,0,.7),
    0 4px 8px rgba(0,0,0,.9),
    inset 0 2px 2px rgba(255,255,255,.15),
    inset 0 -3px 5px rgba(0,0,0,.9);
}

/* Upper metallic highlight */

.visor::before {
  content: "";
  position: absolute;

  top: 5px;
  left: 5%;
  right: 5%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,210,255,.55),
      rgba(255,255,255,.12),
      transparent
    );

  pointer-events: none;
}

/* Housing seam */

.visor::after {
  content: "";
  position: absolute;
  inset: 5px;

  border: 1px solid rgba(0,0,0,.65);
  border-radius: inherit;

  pointer-events: none;
}

/* Recessed lens */

.visor-recess {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 5px;

  border-radius: clamp(12px, 2vw, 20px);

  background:
    linear-gradient(
      180deg,
      #030209 0%,
      #0b0615 45%,
      #1a0829 100%
    );

  border: 1px solid rgba(0,0,0,.9);

  box-shadow:
    inset 0 5px 8px rgba(0,0,0,.95),
    inset 0 -2px 4px rgba(255,255,255,.06);
}

/* Violet illuminated visor */

.visor-light {
  position: relative;

  width: 100%;
  height: 82%;

  overflow: hidden;

  border-radius: clamp(9px, 1.5vw, 15px);

  background:
    linear-gradient(
      180deg,
      #270b4a 0%,
      #6317b9 14%,
      #a037f5 29%,
      #cd89ff 43%,
      #fbecff 50%,
      #dba6ff 57%,
      #aa4cff 74%,
      #651aba 90%,
      #2a0b4d 100%
    );

  box-shadow:
    0 0 6px #dc9fff,
    0 0 16px rgba(180,85,255,.95),
    0 0 32px rgba(162,65,255,.78),
    0 0 65px rgba(139,55,255,.44),
    0 0 110px rgba(112,25,230,.25),
    inset 0 0 10px rgba(245,220,255,.4);

  animation: lightBreathe 5.5s ease-in-out infinite;
}

/* Bright horizontal illumination */

.visor-light::before {
  content: "";
  position: absolute;

  left: 3%;
  right: 3%;
  top: 47%;

  height: 4px;
  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(225,185,255,.75) 16%,
      #ffffff 49%,
      rgba(225,185,255,.75) 84%,
      transparent
    );

  filter: blur(2px);
  opacity: .85;
}

/* Moving lens reflection */

.visor-light::after {
  content: "";
  position: absolute;

  top: -50%;
  bottom: -50%;
  width: 18%;
  left: -30%;

  transform: skewX(-22deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.04),
      rgba(255,255,255,.26),
      rgba(255,255,255,.04),
      transparent
    );

  animation: scanReflection 8s ease-in-out infinite;
}

/* Side hardware */

.visor-cap {
  position: absolute;
  z-index: -1;

  top: 28%;
  width: 4%;
  height: 44%;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      #484254,
      #0e0a17 30%,
      #191322 75%,
      #383144
    );

  border: 1px solid #393248;

  box-shadow:
    0 5px 15px rgba(0,0,0,.7);
}

.visor-cap.left {
  left: -2%;
}

.visor-cap.right {
  right: -2%;
}

/* Violet reflected light */

.visor-reflection {
  position: absolute;

  top: 90%;
  left: 12%;
  width: 76%;
  height: 20px;

  border-radius: 50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(150,55,255,.22),
      rgba(190,95,255,.4),
      rgba(150,55,255,.22),
      transparent
    );

  filter: blur(17px);
}

/* ENTER controls */

.action {
  margin-top: 65px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.action-line {
  width: 62px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(190,110,255,.85),
      transparent
    );
}

/* ENTER button */

.enter-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  min-width: 170px;
  padding: 15px 29px;

  border: 1px solid rgba(186,105,255,.35);
  border-radius: 8px;

  background: rgba(170,85,255,.035);

  color: #efe3ff;

  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 4px;

  cursor: pointer;

  transition:
    color .3s ease,
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    transform .3s ease;
}

.enter-button:hover {
  color: #ffffff;

  background: rgba(160,65,255,.12);
  border-color: rgba(208,145,255,.85);

  box-shadow:
    0 0 20px rgba(153,70,255,.25),
    inset 0 0 15px rgba(153,70,255,.06);

  transform: translateY(-3px);
}

.enter-button:active {
  transform: translateY(0);
}

.enter-button:focus-visible {
  outline: 2px solid #d8b4fe;
  outline-offset: 5px;
}

.enter-button svg {
  width: 15px;
  height: 15px;

  stroke: #d3a3ff;

  transition: transform .3s ease;
}

.enter-button:hover svg {
  transform: translateX(4px);
}

/* Animations */

@keyframes lightBreathe {
  0%, 100% {
    opacity: .88;
    filter: brightness(.94);
  }

  50% {
    opacity: 1;
    filter: brightness(1.15);
  }
}

@keyframes atmosphericPulse {
  0%, 100% {
    opacity: .55;
    transform: scale(.98);
  }

  50% {
    opacity: .85;
    transform: scale(1.03);
  }
}

@keyframes scanReflection {
  0%, 14% {
    left: -30%;
  }

  48%, 100% {
    left: 115%;
  }
}

/* Mobile */

@media (max-width: 600px) {
  .visor-container {
    width: 92vw;
    height: 95px;
  }

  .visor {
    height: 68%;
    padding: 10px;
    border-radius: 17px;
  }

  .visor-recess {
    border-radius: 12px;
    padding: 4px;
  }

  .visor-light {
    border-radius: 8px;
  }

  .action {
    margin-top: 50px;
  }

  .enter-button {
    padding: 14px 24px;
    font-size: 11px;
    letter-spacing: 3px;
  }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="portal">

  <!-- VIOLET VISOR -->

  <div
    class="visor-container"
    role="img"
    aria-label="Futuristic metallic visor illuminated by violet and lavender neon light"
  >

    <div class="visor-cap left"></div>
    <div class="visor-cap right"></div>

    <div class="visor">

      <div class="visor-recess">

        <div class="visor-light"></div>

      </div>

    </div>

    <div class="visor-reflection"></div>

  </div>

  <!-- ENTER BUTTON -->

  <div class="action">

    <div
      class="action-line"
      aria-hidden="true"
    ></div>

    <button
      class="enter-button"
      id="enterButton"
      type="button"
      aria-label="Enter file identifier"
    >

      ENTER

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12 H19"/>
        <path d="M13 6 L19 12 L13 18"/>
      </svg>

    </button>

  </div>

</main>

<script>
"use strict";

/*
  UC PAF ROTC — VIOLET VISOR PORTAL

  Clicking ENTER opens a filename prompt.

  Examples:

  Input: alpha
  Opens: alpha.html

  Input: mission01
  Opens: mission01.html

  Input: briefing.html
  Opens: briefing.html

  Files must be located in the same folder
  as this index.html page.
*/

const enterButton = document.getElementById(
  "enterButton"
);

enterButton.addEventListener("click", function() {

  // Request file identifier.
  const response = window.prompt(
    "FILE ACCESS\n\n" +
    "Enter the designated filename:"
  );

  // Exit when Cancel is selected.
  if (response === null) {
    return;
  }

  let filename = response.trim();

  // Remove optional .html extension.
  filename = filename.replace(/\.html$/i, "");

  /*
    Accept:
    - Letters A-Z or a-z
    - Numbers 0-9
    - Underscores
    - Hyphens

    Reject:
    - Empty input
    - Directory paths
    - URLs
    - Special characters
  */

  const validFilename =
    /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/;

  if (!validFilename.test(filename)) {

    window.alert(
      "INVALID FILE IDENTIFIER\n\n" +
      "Enter a valid filename using letters, " +
      "numbers, underscores, or hyphens.\n\n" +
      "Do not include folder paths, spaces, " +
      "or special characters."
    );

    return;
  }

  // Add the .html extension.
  const destination = filename + ".html";

  // Open in the same folder and browser tab.
  window.location.assign(destination);

});
</script>

</body>
</html>
