<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101e36">
<meta name="description" content="UC PAF ROTC Mentor Access Portal">
<title>UC PAF ROTC</title>

<style>
:root {
  --text: #e3ddec;
  --violet: #a855f7;
  --purple: #8b5cf6;
  --lavender: #d8b4fe;
  --electric: #b75cff;
  --ice: #f3e8ff;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;

  /* Blue-violet covert-tech atmosphere */
  background:
    radial-gradient(
      ellipse at 14% 16%,
      rgba(38,146,218,.28),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 84% 18%,
      rgba(125,74,205,.24),
      transparent 38%
    ),
    radial-gradient(
      ellipse at 51% 92%,
      rgba(53,98,182,.23),
      transparent 50%
    ),
    linear-gradient(
      135deg,
      #152e46 0%,
      #101e36 38%,
      #191b34 75%,
      #111d36 100%
    );
}

/* Tactical grid */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .82;

  background-image:
    linear-gradient(
      rgba(135,202,248,.115) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(135,202,248,.115) 1px,
      transparent 1px
    ),
    linear-gradient(
      rgba(135,202,248,.04) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(135,202,248,.04) 1px,
      transparent 1px
    );

  background-size:
    52px 52px,
    52px 52px,
    13px 13px,
    13px 13px;
}

/* Scanlines and ambient targeting rings */

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 4px,
      rgba(155,204,255,.018) 4px 5px
    ),
    radial-gradient(
      circle at 50% 42%,
      transparent 0 185px,
      rgba(135,205,255,.055) 186px 187px,
      transparent 188px 285px,
      rgba(135,205,255,.045) 286px 287px,
      transparent 288px
    ),
    linear-gradient(
      120deg,
      transparent 15%,
      rgba(95,166,255,.065) 50%,
      transparent 86%
    );
}

/* Main layout */

.portal {
  position: relative;
  z-index: 1;
  width: min(1120px, calc(100% - 28px));
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 36px 0 44px;
  isolation: isolate;
}

/* Mentors */

.mentors {
  width: min(860px, 100%);
  margin: 0 auto 30px;
}

.mentors-heading {
  margin: 0 0 19px;
  text-align: center;
  color: #b6e2ff;

  font-family: Consolas, "Courier New", monospace;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: .36em;

  text-shadow:
    0 0 17px rgba(78,185,255,.45);
}

.mentor-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: clamp(10px, 2.2vw, 20px);
}

.mentor-card {
  min-width: 0;
  padding: clamp(6px, 1.2vw, 11px);

  border: 1px solid rgba(139,213,255,.34);
  border-radius: 14px;

  background:
    linear-gradient(
      150deg,
      rgba(27,62,103,.9),
      rgba(17,23,49,.96)
    );

  box-shadow:
    0 15px 30px rgba(2,9,26,.38),
    inset 0 1px rgba(206,239,255,.12);

  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.mentor-card:hover {
  transform: translateY(-5px);
  border-color: rgba(178,232,255,.8);

  box-shadow:
    0 19px 32px rgba(2,9,26,.45),
    0 0 24px rgba(118,148,255,.14);
}

/* Tarot illustrations */

.tarot-art {
  overflow: hidden;
  aspect-ratio: 2 / 3;

  border: 1px solid rgba(191,229,255,.38);
  border-radius: 7px;
  background: #101c39;
}

.tarot-art svg {
  display: block;
  width: 100%;
  height: 100%;
}

.tarot-figure {
  transform-origin: 140px 215px;
  transition: transform .35s ease;
}

.mentor-card:hover .tarot-figure {
  transform: translateY(-4px) scale(1.02);
}

.mentor-info {
  text-align: center;
  padding: 14px 3px 10px;
}

.mentor-name {
  margin: 0;
  color: #f0f7ff;
  font-size: clamp(13px, 1.9vw, 21px);
  font-weight: 800;
  letter-spacing: .16em;
}

.mentor-subtitle {
  margin: 7px 0 0;
  color: #a4caff;
  font-size: clamp(9px, 1.15vw, 11px);
  text-transform: uppercase;
  letter-spacing: .13em;
}

/* ENTER section */

.action {
  margin-top: 8px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.action-line {
  width: 62px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(190,110,255,.85),
      transparent
    );
}

.enter-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  min-width: 170px;
  padding: 15px 29px;

  border: 1px solid rgba(186,105,255,.35);
  border-radius: 8px;

  background: rgba(170,85,255,.035);
  color: #efe3ff;

  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 4px;

  cursor: pointer;

  transition:
    color .3s ease,
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    transform .3s ease;
}

.enter-button:hover {
  color: #ffffff;
  background: rgba(160,65,255,.12);
  border-color: rgba(208,145,255,.85);

  box-shadow:
    0 0 20px rgba(153,70,255,.25),
    inset 0 0 15px rgba(153,70,255,.06);

  transform: translateY(-3px);
}

.enter-button:active {
  transform: translateY(0);
}

.enter-button:focus-visible {
  outline: 2px solid #d8b4fe;
  outline-offset: 5px;
}

.enter-button svg {
  width: 15px;
  height: 15px;
  stroke: #d3a3ff;
  transition: transform .3s ease;
}

.enter-button:hover svg {
  transform: translateX(4px);
}

/* Mobile layout */

@media (max-width: 580px) {
  .portal {
    padding: 30px 0 35px;
  }

  .mentor-grid {
    gap: 7px;
  }

  .mentor-card {
    padding: 5px;
    border-radius: 9px;
  }

  .mentor-info {
    padding: 10px 1px 7px;
  }

  .mentor-name {
    font-size: clamp(9px, 2.6vw, 13px);
    letter-spacing: .025em;
  }

  .mentor-subtitle {
    font-size: clamp(7px, 1.9vw, 9px);
    letter-spacing: 0;
  }

  .mentors-heading {
    font-size: 11px;
    margin-bottom: 14px;
  }

  .mentors {
    margin-bottom: 17px;
  }

  .enter-button {
    padding: 14px 24px;
    font-size: 11px;
    letter-spacing: 3px;
  }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

  Clicking ENTER opens a filename prompt.

  Examples:
    alpha        -> alpha.html
    mission01    -> mission01.html
    briefing.html -> briefing.html

  The destination must be in the same folder
  as this index.html file.
*/

const enterButton = document.getElementById("enterButton");

enterButton.addEventListener("click", function () {

  const response = window.prompt(
    "FILE ACCESS\n\n" +
    "OPERATION CODE:"
  );

  if (response === null) {
    return;
  }

  let filename = response.trim();

  // Allow input with or without the .html extension.
  filename = filename.replace(/\.html$/i, "");

  // Restrict to simple filenames.
  const validFilename = /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/;

  if (!validFilename.test(filename)) {

    window.alert(
      "INVALID FILE IDENTIFIER\n\n" +
      "Enter a valid filename using letters, " +
      "numbers, underscores, or hyphens.\n\n" +
      "Do not include folder paths, spaces, " +
      "or special characters."
    );

    return;
  }

  const destination = filename + ".html";

  // Navigate within the same directory and browser tab.
  window.location.assign(destination);

});
</script>

</body>
</html>
